[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundad-inference"
version = "1.0.0"
description = "Inference-only anomaly detection package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "torch>=2.1",
]

[project.scripts]
foundad-infer = "foundad_infer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["foundad_infer*"]

